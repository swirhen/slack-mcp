# Slack アカウントの設定の例。accounts/<アカウント名>.toml にコピーして使う。
# アカウント名 (ファイル名) は英小文字・数字・ハイフン・アンダースコアで 32 文字まで。
# MCP の各ツールの account にこの名前を指定する。
#
# user_token は Slack アプリの「User OAuth Token」(xoxp- で始まる)。
# 取り方は README の「Slack アプリの作成とトークンの取得」を参照。
user_token = "xoxp-0000000000-0000000000-0000000000-00000000000000000000000000000000"

# 任意。アカウント一覧に出す説明 (どのメールアドレスで入っているどのワークスペースか、など)
label = "個人用ワークスペース (example@example.com)"

# 任意。true にするとこのアカウントでは読み取りだけできる (送信・リアクション・作成系は断る)
read_only = false
